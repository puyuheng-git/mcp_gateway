location = /mcp {
    proxy_pass http://mcp_gateway;
}

location = /health {
    proxy_pass http://mcp_gateway;
}

location = /health/live {
    access_log off;
    proxy_pass http://mcp_gateway;
}

location = /health/ready {
    access_log off;
    proxy_pass http://mcp_gateway;
}

location / {
    return 404;
}
