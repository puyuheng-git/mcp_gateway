worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    default_type application/json;
    server_tokens off;
    log_format gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout gateway;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    gzip off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream mcp_gateway {
        zone mcp_gateway 64k;
        server gateway:3000 resolve;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;

    include /etc/nginx/gateway-server.conf;
}
