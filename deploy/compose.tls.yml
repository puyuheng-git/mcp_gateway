services:
  nginx:
    ports: !override
      - target: 8443
        published: "8443"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ./deploy/nginx/tls.conf
        target: /etc/nginx/gateway-server.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/certs/fullchain.pem
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/certs/privkey.pem
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind:
          create_host_path: false
