services:
  dev-mcp:
    environment:
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_ALLOWED_REPOSITORIES: "${GITHUB_ALLOWED_REPOSITORIES:?Set an explicit owner/repository allowlist}"
      GITHUB_TOKEN_FILE: /run/secrets/github_token
    secrets:
      - github_token

secrets:
  github_token:
    file: ./secrets/github_token
