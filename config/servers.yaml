gateway:
  host: 127.0.0.1
  port: 3000
  allowedHosts: [localhost, 127.0.0.1, "[::1]"]
  allowedOrigins: []
  requestBodyLimitBytes: 1048576
  sessionTtlMs: 1800000
  maxSessions: 1000
  maxSessionsPerIdentity: 100
  healthIntervalMs: 30000

auth:
  identities:
    - id: admin
      tokenEnv: GATEWAY_ADMIN_TOKEN
      roles: [admin]
    - id: viewer
      tokenEnv: GATEWAY_VIEWER_TOKEN
      roles: [viewer]
    - id: developer
      tokenEnv: GATEWAY_DEVELOPER_TOKEN
      roles: [developer]
    - id: operator
      tokenEnv: GATEWAY_OPERATOR_TOKEN
      roles: [operator]

policy:
  allowProduction: false

audit:
  path: var/audit/gateway.jsonl

servers:
  - id: dev
    name: Development MCP
    transport: streamable-http
    url: ${DEV_MCP_URL:-http://127.0.0.1:3001/mcp}
    authTokenEnv: MCP_UPSTREAM_TOKEN
    timeoutMs: 15000
    tools:
      git.status:
        publicName: git_status
        capabilityLevel: L0
        requiredScopes: [git:read]
        idempotent: true
      git.log:
        publicName: git_log
        capabilityLevel: L0
        requiredScopes: [git:read]
        idempotent: true
      git.pull:
        publicName: git_pull
        capabilityLevel: L1
        requiredScopes: [git:write]
        timeoutMs: 30000
        sideEffects: [git_worktree_update]
      github.issue.list:
        publicName: github_issue_list
        capabilityLevel: L0
        requiredScopes: [github:read]
        idempotent: true
      github.pr.list:
        publicName: github_pr_list
        capabilityLevel: L0
        requiredScopes: [github:read]
        idempotent: true
      github.pr.create:
        publicName: github_pr_create
        capabilityLevel: L1
        requiredScopes: [github:write]
        sideEffects: [pull_request_created]

  - id: infra
    name: Infrastructure MCP
    transport: streamable-http
    url: ${INFRA_MCP_URL:-http://127.0.0.1:3003/mcp}
    authTokenEnv: MCP_UPSTREAM_TOKEN
    timeoutMs: 15000
    tools:
      server.info:
        publicName: server_info
        capabilityLevel: L0
        requiredScopes: [server:read]
        idempotent: true
      server.disk:
        publicName: server_disk
        capabilityLevel: L0
        requiredScopes: [server:read]
        idempotent: true
      server.memory:
        publicName: server_memory
        capabilityLevel: L0
        requiredScopes: [server:read]
        idempotent: true
      docker.ps:
        publicName: docker_ps
        capabilityLevel: L0
        requiredScopes: [docker:read]
        idempotent: true
      docker.logs:
        publicName: docker_logs
        capabilityLevel: L0
        requiredScopes: [docker:read]
        idempotent: true
      docker.restart:
        publicName: docker_restart
        capabilityLevel: L2
        requiredScopes: [docker:write]
        timeoutMs: 30000
        sideEffects: [container_restart]

  - id: blog
    name: Blog MCP
    transport: streamable-http
    url: ${BLOG_MCP_URL:-http://127.0.0.1:3002/mcp}
    authTokenEnv: MCP_UPSTREAM_TOKEN
    timeoutMs: 15000
    tools:
      blog.search:
        publicName: blog_search
        capabilityLevel: L0
        requiredScopes: [blog:read]
        idempotent: true
      blog.get:
        publicName: blog_get
        capabilityLevel: L0
        requiredScopes: [blog:read]
        idempotent: true
      blog.create:
        publicName: blog_create
        capabilityLevel: L1
        requiredScopes: [blog:write]
        sideEffects: [article_created]
      blog.update:
        publicName: blog_update
        capabilityLevel: L1
        requiredScopes: [blog:write]
        sideEffects: [article_updated]
      blog.publish:
        publicName: blog_publish
        capabilityLevel: L2
        requiredScopes: [blog:write]
        sideEffects: [article_published]
